  <!-- Ritsleting / garis dekoratif -->
  <line x1="30" y1="58" x2="70" y2="58" stroke="#3A8A9C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pocket depan -->
  <rect x="30" y="65" width="40" height="18" rx="6" fill="#1D5566"/>
