<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Tas / Backpack putih (untuk background gelap) -->
  <!-- Body tas -->
  <rect x="18" y="38" width="64" height="50" rx="10" ry="10" fill="white"/>
  <!-- Penutup atas tas -->
  <path d="M18 48 Q18 38 28 38 L72 38 Q82 38 82 48 Z" fill="rgba(255,255,255,0.75)"/>
  <!-- Tali tas kiri -->
  <path d="M32 38 Q28 20 36 14 Q40 10 44 14 Q46 18 42 26 L42 38" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="6" stroke-linecap="round"/>
  <!-- Tali tas kanan -->
  <path d="M68 38 Q72 20 64 14 Q60 10 56 14 Q54 18 58 26 L58 38" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="6" stroke-linecap="round"/>
  <!-- Klip tali tengah -->
  <rect x="40" y="22" width="20" height="8" rx="4" fill="rgba(255,255,255,0.9)"/>
  <!-- Ritsleting / garis dekoratif -->
  <line x1="30" y1="58" x2="70" y2="58" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pocket depan -->
  <rect x="30" y="65" width="40" height="18" rx="6" fill="rgba(255,255,255,0.75)"/>
  <!-- Ritsleting pocket depan -->
  <line x1="36" y1="72" x2="64" y2="72" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <!-- Highlight -->
  <ellipse cx="34" cy="45" rx="5" ry="3" fill="rgba(255,255,255,0.4)" transform="rotate(-20 34 45)"/>
</svg>
